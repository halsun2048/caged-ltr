name: caged-ltr

services:
  caged-api:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    command: ["uvicorn", "scripts.run_r16_api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      R16_BACKEND: ${R16_BACKEND:-cached}
      R16_DEVICE: ${R16_DEVICE:-cpu}
      R16_MODEL_PATH: ${R16_MODEL_PATH:-/app/artifacts/models/all-MiniLM-L6-v2}
      R16_STUDENT_CHECKPOINT: ${R16_STUDENT_CHECKPOINT:-/app/artifacts/r16_runtime/mind_r13_reweight_mild.pt}
      R16_FIRST_RESULTS: ${R16_FIRST_RESULTS:-/app/runs/mind_r10_0/dev_first/results.jsonl}
      CAGED_DENSE_PROVIDER: ${CAGED_DENSE_PROVIDER:-token_overlap}
      CAGED_EVENT_DB: /app/runs/caged_events.sqlite3
      POSTGRES_DSN: postgresql://caged:change-me-in-local-env@postgres:5432/caged_ltr
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./runs:/app/runs
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
  caged-mcp:
    build:
      context: .
      dockerfile: Dockerfile.demo
    command: ["python", "scripts/run_mcp_server.py", "--http", "--host", "0.0.0.0", "--port", "8765"]
    environment:
      CAGED_API_URL: http://caged-api:8000
    ports: ["8765:8765"]
    depends_on: [caged-api]
  caged-ui:
    build:
      context: .
      dockerfile: Dockerfile.demo
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      PYTHONPATH: /app/src
      R18_API_URL: http://caged-api:8000
    ports: ["8501:8501"]
    depends_on: [caged-api]
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: caged_ltr
      POSTGRES_USER: caged
      POSTGRES_PASSWORD: change-me-in-local-env
    volumes: [caged-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caged -d caged_ltr"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  qdrant:
    image: docker.m.daocloud.io/qdrant/qdrant:v1.15.1
    volumes: [caged-qdrant:/qdrant/storage]
    ports: ["6333:6333", "6334:6334"]
    healthcheck:
      test: ["CMD-SHELL", "grep -q entrypoint /proc/1/cmdline"]
      interval: 5s
      timeout: 3s
      retries: 10
  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./monitoring/prometheus.demo.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [caged-api]
  grafana:
    image: docker.m.daocloud.io/grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-caged-demo}
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  caged-postgres:
  caged-qdrant:
