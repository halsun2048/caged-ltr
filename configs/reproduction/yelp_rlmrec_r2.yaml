processed_dir: data/processed/rlmrec_yelp_author
output_root: runs/rlmrec_r2
report: reports/experiments/rlmrec_r2.json

variants: [lightgcn, semantic_only, rlmrec_con, shuffled_con]
seeds: [42, 2024, 3407]

model:
  embedding_dim: 32
  layer_count: 3
  keep_rate: 0.8
  semantic_adapter: shared_mlp
  public_semantic_dimension: 1536
  local_semantic_dimension: 64

training:
  batch_size: 1024
  learning_rate: 0.001
  baseline_regularization_weight: 0.000001
  con_regularization_weight: 0.0000001
  official_code_alignment_weight: 0.01
  temperature: 0.2
  max_epochs: 300
  evaluation_interval: 3
  patience: 5
  resume_checkpoint_each_epoch: true

evaluation:
  cutoffs: [5, 10, 20]
  selection_metric: Recall@20
  ranking: full_catalog
  mask: train_only
  test_after_selection: true

limitations:
  - Public semantic profiles have no verifiable train-only cutoff.
  - PCA64 and batch size 1024 make this a local structure reproduction.
  - Epoch time is training cost and must not be reported as online latency.
