[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "caged-ltr"
version = "0.1.0"
description = "Confidence-aware semantic-collaborative enhancement and ranking distillation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "datasets==4.0.0",
  "duckdb==1.3.2",
  "lightgbm==4.6.0",
  "matplotlib==3.10.3",
  "numpy==2.3.1",
  "pandas==2.3.1",
  "polars==1.31.0",
  "pyarrow==20.0.0",
  "pyparsing==3.2.3",
  "pyyaml==6.0.2",
  "scikit-learn==1.7.0",
  "scipy==1.16.0",
  "torch==2.7.1",
  "transformers==4.53.2",
]

[project.scripts]
caged-env = "caged_ltr.reproducibility:main"
caged-r0-smoke = "caged_ltr.r0_smoke:main"

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.4",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/caged_ltr"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=caged_ltr --cov-report=term-missing --cov-fail-under=85"
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
